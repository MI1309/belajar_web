<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pertemuan7-8</title>
</head>
<style>
    :root{
        margin: 0px;
        padding: 0px;
    }

    body{
        display: flex;
        justify-content: center;
    }
    div{
        background-color: red;
        margin: 30px;
        margin-right: 100px;
        border-radius: 10px;
        border-style: solid;
        text-align: center;
        justify-content: center;
        align-items: center;
    }

    .kotak1{
        padding: 10px;
        height: 100px;
        width: 100px;
    }

    .kotak2{
        padding: 20px;
        height: 250px;
        width: 250px;
    }

    .kotak3{
        padding: 30px;
        height: 350px;
        width: 350px;
    }

    div:hover{
        background-color: blue;
    }


</style>
<body>
    <div class="kotak1">
        kotak kecil
    </div>
    <div class="kotak2">
        kotak sedang
    </div>
    <div class="kotak3">
        kotak besar
    </div>
</body>
</html>
