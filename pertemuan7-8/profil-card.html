<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profil card</title>

    <style>
        :root{
            margin: 0px;
            padding: 0px;
        }

        body {
    margin: 0;
    padding: 0;
    height: 100vh; /* supaya body penuh setinggi layar */
    display: flex;
    justify-content: center; /* center horizontal */
    align-items: center;     /* center vertical */
    background-color: #f0f0f0; /* biar kontras aja */
}


        .card{
            background-color: blue;
            justify-content: center;
            align-items: center;
            display: flex;
            width: 600px;
            padding: 5px;
            border-style: solid;
            border-radius: 10px;
            box-shadow: 5px 5px ;
        }

        img{
            border-radius: 10px;
        }
        h2{
            margin-left: 10px
        }

        p{
            margin-left: 10px;
            margin-right: 40px;
            color: rgb(22, 203, 235);

        }

        ul{
            margin-right: 50px;
        }
    </style>
</head>
<body>

    <br>
    <div class="card">
        <img src="./assets/ppku.jpeg" alt="pp" width="100px" height="100px">
        <h2>
            Muhammad Imron
        </h2>
        <p>
            kelas XII RPL 2
        </p>
        
        <h5>hobi</h5>
        <ul>
            <li>ngoding</li>
            <li>bermain</li>
        </ul>
    </div>
</body>
</html>
