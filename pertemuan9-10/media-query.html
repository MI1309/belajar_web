<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LKPD 3 - Responsive</title>
  <style>
    * { 
    box-sizing:border-box; 
    }
    body { 
        margin:0; 
        font-family:sans-serif; 
    }
    .wrap { 
        display:flex; 
        flex-wrap:wrap;
        gap:12px; 
        padding:16px; 
    }
    /* default hp */
    .box {
      flex:1 1 100%; 
      background:#facc15;
      padding:20px; 
      border-radius:8px; 
      text-align:center;
    }

    /* flex:1 1 calc() <- akan mengurangi lebar dari semula 100% menjadi 50 dst */
    /* lebar tablet */
    @media (min-width:768px) {
      .box { 
        flex:1 1 calc(50% - 12px); 
    }
    }

    /* lebar laptop */
    @media (min-width:1024px) {
      .box { 
        flex:1 1 calc(33.333% - 12px); 
    }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
    <div class="box">Box 4</div>
    <div class="box">Box 5</div>
    <div class="box">Box 6</div>
  </div>
</body>
</html>
